{{- if and .Values.persistence.existingClaim .Values.persistence.volumeName }}
{{- fail "persistence.existingClaim and persistence.volumeName are mutually exclusive" }}
{{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "weather-skills-chat.fullname" . }}
  labels:
    {{- include "weather-skills-chat.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keep .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.volumeName }}
  storageClassName: ""
  volumeName: {{ include "weather-skills-chat.pvName" . }}
  {{- else }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}

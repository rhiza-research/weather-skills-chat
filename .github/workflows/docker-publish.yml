name: Docker Publish

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rhiza-research/weather-skills-chat
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            USE_CUDA=false
            USE_OLLAMA=false
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin Chart.appVersion to image sha
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA:0:7}"
          export TAG
          FILE=charts/weather-skills-chat/Chart.yaml
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          tag = os.environ["TAG"]
          path = Path("charts/weather-skills-chat/Chart.yaml")
          text = path.read_text()
          updated, n = re.subn(
              r"^appVersion:.*$",
              f'appVersion: "{tag}"',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(f"failed to replace appVersion in {path}")
          path.write_text(updated)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Chart.appVersion already ${TAG}"
            exit 0
          fi
          git commit -m "chore: pin image to ${TAG} [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "$BRANCH"

name: Docker Publish

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rhiza-research/weather-skills-chat
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            USE_CUDA=false
            USE_OLLAMA=false
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main → prod (Argo prod chat). dev → staging (Argo staging chat).
      # Those deploy branches are CI-owned; this job force-pushes the built
      # commit plus Chart.appVersion pin and does not commit back to main/dev.
      - name: Deploy branch
        id: deploy
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "branch=prod" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "branch=staging" >> "$GITHUB_OUTPUT" ;;
            *)    echo "unexpected branch ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Pin Chart.appVersion to image sha
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.appVersion = strenv(IMAGE_TAG)' charts/weather-skills-chat/Chart.yaml

      - name: Push pin to Argo branch
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/weather-skills-chat/Chart.yaml
          if git diff --cached --quiet; then
            echo "Chart.appVersion already ${IMAGE_TAG}"
            exit 0
          fi
          git commit -m "chore: pin image to ${IMAGE_TAG} [skip ci]"
          git push --force origin "HEAD:${DEPLOY_BRANCH}"

name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rhiza-research/weather-skills-chat
          tags: |
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            USE_CUDA=false
            USE_OLLAMA=false
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # staging: every push to dev, image tag sha-<short>.
      # prod: only semver tags that point at a commit on main; image tag is that tag.
      # Pushes to main still build GHCR images (main / sha- / latest) but do not
      # update the Argo prod branch.
      - name: Deploy branch
        id: deploy
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
              echo "tag ${GITHUB_REF_NAME} is not semver" >&2
              exit 1
            fi
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "tag ${GITHUB_REF_NAME} is not on main; refusing prod deploy" >&2
              exit 1
            fi
            echo "branch=prod" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "branch=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main builds images only; prod deploys from semver tags"
          else
            echo "unexpected ref ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Pin Chart.appVersion to image tag
        if: steps.deploy.outputs.skip != 'true'
        run: echo "IMAGE_TAG=${{ steps.deploy.outputs.image_tag }}" >> "$GITHUB_ENV"

      - uses: mikefarah/yq@v4
        if: steps.deploy.outputs.skip != 'true'
        with:
          cmd: yq -i '.appVersion = strenv(IMAGE_TAG)' charts/weather-skills-chat/Chart.yaml

      - name: Push pin to Argo branch
        if: steps.deploy.outputs.skip != 'true'
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/weather-skills-chat/Chart.yaml
          if git diff --cached --quiet; then
            echo "Chart.appVersion already ${IMAGE_TAG}"
            exit 0
          fi
          git commit -m "chore: pin image to ${IMAGE_TAG} [skip ci]"
          git push --force origin "HEAD:${DEPLOY_BRANCH}"

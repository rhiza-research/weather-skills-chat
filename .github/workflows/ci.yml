name: CI

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        id: vitest
        run: |
          mkdir -p test-results
          npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml

      - name: Publish frontend unit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend unit tests
          path: test-results/vitest.xml
          reporter: java-junit

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/backend/open_webui
        run: |
          mkdir -p test-results
          python -m pytest backend/open_webui/test --import-mode=importlib --junitxml=test-results/pytest.xml

      - name: Publish backend unit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend unit tests
          path: test-results/pytest.xml
          reporter: java-junit

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: weather-skills-chat:e2e
          build-args: |
            USE_CUDA=false
            USE_OLLAMA=false
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start app
        run: |
          docker run -d --name weather-skills-chat-e2e \
            -p 3000:8080 \
            -e WEBUI_SECRET_KEY=e2e-secret \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD=password \
            -e BOOTSTRAP_ADMIN_NAME=Admin \
            -e ENABLE_SIGNUP=true \
            weather-skills-chat:e2e

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: playwright
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: password
          E2E_ADMIN_NAME: Admin
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Publish Playwright report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright smoke tests
          path: test-results/playwright.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

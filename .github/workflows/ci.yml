name: CI

on:
  # Pull requests into any branch, so stacked pull requests get CI.
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        id: vitest
        run: |
          mkdir -p test-results
          npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml

      - name: Publish frontend unit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend unit tests
          path: test-results/vitest.xml
          reporter: java-junit

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: uv.lock

      - name: Install backend
        run: uv sync --frozen --no-install-project

      - name: Run pytest
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/backend/open_webui
        run: |
          mkdir -p test-results
          uv run --frozen --no-sync python -m pytest backend/open_webui/test --import-mode=importlib --junitxml=test-results/pytest.xml

      - name: Publish backend unit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend unit tests
          path: test-results/pytest.xml
          reporter: java-junit

  e2e:
    name: Playwright smoke tests
    # ubuntu-22.04 ships kernel 6.8, the series staging and prod run.
    runs-on: ubuntu-22.04
    # Job-level permissions replace the workflow-level set.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: write
    env:
      # Fork PRs cannot write to GHCR; they build without the registry cache.
      USE_REGISTRY_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.USE_REGISTRY_CACHE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: weather-skills-chat:e2e
          build-args: |
            USE_CUDA=false
            USE_OLLAMA=false
            BUILD_HASH=${{ github.sha }}
          cache-from: ${{ env.USE_REGISTRY_CACHE == 'true' && format('type=registry,ref=ghcr.io/rhiza-research/weather-skills-chat:buildcache-ci-{0}', github.event.pull_request.number) || '' }}
          cache-to: ${{ env.USE_REGISTRY_CACHE == 'true' && format('type=registry,ref=ghcr.io/rhiza-research/weather-skills-chat:buildcache-ci-{0},mode=max', github.event.pull_request.number) || '' }}

      # The login action logs out only at job end; the steps below run PR code.
      - name: Log out of GHCR
        if: always() && env.USE_REGISTRY_CACHE == 'true'
        run: docker logout ghcr.io

      # Fails when Landlock is unavailable in the container or the skill does not run under it.
      - name: Run a skill under the default Landlock sandbox backend
        run: |
          # The volumes and path variables match staging's Helm values.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/scripts/ci_skill_sandbox_check.py:/app/backend/ci_skill_sandbox_check.py:ro" \
            -v /var/skill-venvs \
            -v /mnt/gcs-data \
            -e WEBUI_SECRET_KEY=ci-sandbox-check-secret \
            -e SKILL_VENV_ROOT=/var/skill-venvs \
            -e SKILLS_DIR=/mnt/gcs-data/skills \
            -e ARTIFACTS_DIR=/mnt/gcs-data/artifacts \
            -e USER_CACHES_DIR=/mnt/gcs-data/user_caches \
            weather-skills-chat:e2e \
            python ci_skill_sandbox_check.py

      - name: Run a skill under the landlock_only sandbox backend
        run: |
          # The volumes and path variables match staging's Helm values.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/scripts/ci_skill_sandbox_check.py:/app/backend/ci_skill_sandbox_check.py:ro" \
            -v /var/skill-venvs \
            -v /mnt/gcs-data \
            -e WEBUI_SECRET_KEY=ci-sandbox-check-secret \
            -e SKILL_VENV_ROOT=/var/skill-venvs \
            -e SKILLS_DIR=/mnt/gcs-data/skills \
            -e ARTIFACTS_DIR=/mnt/gcs-data/artifacts \
            -e USER_CACHES_DIR=/mnt/gcs-data/user_caches \
            -e SKILL_LANDLOCK_BACKEND=landlock_only \
            weather-skills-chat:e2e \
            python ci_skill_sandbox_check.py

      - name: Start app
        run: |
          docker run -d --name weather-skills-chat-e2e \
            -p 3000:8080 \
            -e WEBUI_SECRET_KEY=e2e-secret \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD=password \
            -e BOOTSTRAP_ADMIN_NAME=Admin \
            -e ENABLE_SIGNUP=true \
            -e ENABLE_E2E_FIXTURES=true \
            weather-skills-chat:e2e

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: playwright
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: password
          E2E_ADMIN_NAME: Admin
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Publish Playwright report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright smoke tests
          path: test-results/playwright.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

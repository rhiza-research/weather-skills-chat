services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    # Image and container name are overridable. A local build tags the image name, which would
    # retag an image used by another stack on the same Docker daemon, and a fixed container name
    # collides with a container of the same name. Defaults are the upstream values.
    image: ${WEBUI_IMAGE-ghcr.io/open-webui/open-webui}:${WEBUI_DOCKER_TAG-main}
    container_name: ${WEBUI_CONTAINER_NAME-open-webui}
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      # Bare names: passed only when set in .env or the shell, never as an empty string.
      - ENABLE_OPENAI_API
      - OPENAI_API_BASE_URL
      - OPENAI_API_KEY
      - WEBUI_SECRET_KEY
      - WEBUI_URL
      - EMAIL_TOOL_SMTP_HOST
      - EMAIL_TOOL_SMTP_PORT
      - EMAIL_TOOL_SMTP_USERNAME
      - EMAIL_TOOL_SMTP_PASSWORD
      - EMAIL_TOOL_SMTP_USE_TLS
      - EMAIL_TOOL_FROM_EMAIL
      - SKILL_SANDLOCK
      - SKILL_SANDBOX_BACKEND
      - SKILL_K8S_SANDBOX_ENABLED
      - SKILL_K8S_EMULATOR
      - SKILL_K8S_BIND_TOKEN
      - SKILL_K8S_APISERVER
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_HOST
      - LANGFUSE_BASE_URL
      - LANGFUSE_TRACING_ENVIRONMENT
      - LANGFUSE_ENABLED
      - LANGFUSE_TRACING_ENABLED
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # HTTP/2 front door. Started by ./run-compose.sh --testing.
  caddy:
    profiles:
      - testing
    image: caddy:2-alpine
    container_name: weather-skills-h2
    ports:
      - ${CADDY_HTTPS_PORT-3443}:443
      - ${CADDY_HTTP_PORT-80}:80
    environment:
      CADDY_UPSTREAM: open-webui:8080
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT-3443}
    volumes:
      - ./Caddyfile.local-h2:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - open-webui
    restart: unless-stopped

  # Local stand-in for the GKE tool-runner APIs. Started by
  # ./run-compose.sh --isolation=emulator. Runs on the cluster's runner image
  # (uv, Chromium, CPython, sandbox_runtime.py), built in
  # rhiza-research/infrastructure images/sandbox-runner. The default tag is the
  # one pinned in that repo's charts/weather-skills-sandbox/values.yaml;
  # SANDBOX_RUNNER_IMAGE overrides it. Shares the app data volume so skill
  # files land in the same artifacts folder the UI reads.
  emulator:
    profiles:
      - emulator
    image: ${SANDBOX_RUNNER_IMAGE:-ghcr.io/rhiza-research/weather-skills-sandbox-runner:src-8f4552f21a8b}
    container_name: weather-skills-emulator
    user: "0"
    working_dir: /opt/sandbox
    command:
      - python3
      - -u
      - /opt/sandbox/emulator/emulator.py
    volumes:
      - ./sandbox:/opt/sandbox:ro
      - open-webui:/data
    environment:
      DATA_DIR: /data
      ARTIFACTS_DIR: /data/artifacts
      SKILL_K8S_EMULATOR_HOST: emulator
      SKILL_K8S_BIND_TOKEN: ${SKILL_K8S_BIND_TOKEN:-dev}
      SKILL_K8S_EMULATOR_API_PORT: "18080"
      SKILL_K8S_BIND_PORT: "9090"
      SKILL_K8S_EMULATOR_START_DELAY: ${SKILL_K8S_EMULATOR_START_DELAY:-15}
      # The limit the memory gauge shows; there is no cgroup here, so nothing
      # enforces it. Matches the cluster runner limit (infrastructure values.yaml).
      SKILL_RUNNER_MEMORY_LIMIT_GIB: "8"
    restart: unless-stopped

  # Runs the backend test suite in the test target of the application image. It is behind the
  # suite profile, so `up` does not start it. Run with:
  #   docker compose --profile suite run --rm --build test
  # It has no container_name, ports, volumes, or Docker socket.
  test:
    profiles:
      - suite
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    # Reaps killed skill subprocesses. A zombie still answers os.kill(pid, 0), so without this the
    # cancellation test sees the killed process as alive.
    init: true
    working_dir: /app/backend
    command:
      - python
      - -m
      - pytest
      - open_webui/test
      - --import-mode=importlib
      - -rf
    environment:
      # The application refuses to import without a secret key. This value is used only by the
      # test run.
      - 'WEBUI_SECRET_KEY=suite-run-not-a-deployment'

volumes:
  open-webui:
    name: ${WEBUI_DATA_VOLUME:-weather-skills-chat-data}
  caddy-data:
    name: ${CADDY_DATA_VOLUME:-weather-skills-caddy-data}

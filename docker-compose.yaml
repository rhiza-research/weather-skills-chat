services:
  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    # Image and container name are overridable. A local build tags the image name, which would
    # retag an image used by another stack on the same Docker daemon, and a fixed container name
    # collides with a container of the same name. Defaults are the upstream values.
    image: ${WEBUI_IMAGE-ghcr.io/open-webui/open-webui}:${WEBUI_DOCKER_TAG-main}
    container_name: ${WEBUI_CONTAINER_NAME-open-webui}
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    # Runs an init process that reaps killed skill subprocesses so they do not remain as zombies.
    init: true
    environment:
      # Bare names: passed only when set in .env or the shell, never as an empty string.
      - ENABLE_OPENAI_API
      - OPENAI_API_BASE_URL
      - OPENAI_API_KEY
      - WEBUI_URL
      - WEBUI_SECRET_KEY
      - REDIS_URL
      - SKILL_SANDLOCK
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_HOST
      - LANGFUSE_BASE_URL
      - LANGFUSE_TRACING_ENVIRONMENT
      - LANGFUSE_ENABLED
      - LANGFUSE_TRACING_ENABLED
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # Runs the backend test suite in the test target of the application image. It is behind the
  # suite profile, so `up` does not start it. Run with:
  #   docker compose --profile suite run --rm --build test
  # It has no container_name, ports, volumes, or Docker socket.
  test:
    profiles:
      - suite
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    # Reaps killed skill subprocesses. A zombie still answers os.kill(pid, 0), so without this the
    # cancellation test sees the killed process as alive.
    init: true
    working_dir: /app/backend
    command:
      - python
      - -m
      - pytest
      - open_webui/test
      - --import-mode=importlib
      - -rf
    environment:
      # The application refuses to import without a secret key. This value is used only by the
      # test run.
      - 'WEBUI_SECRET_KEY=suite-run-not-a-deployment'

volumes:
  open-webui: {}

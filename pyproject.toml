[project]
name = "open-webui"
description = "Open WebUI"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.115.7",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "python-multipart==0.0.20",

    "python-socketio==5.13.0",
    "python-jose==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography>=42.0.0",

    "requests==2.34.2",
    "aiohttp==3.11.11",
    "async-timeout",
    "aiocache",
    "aiofiles",

    "sqlalchemy==2.0.38",
    "alembic==1.14.0",
    "peewee==3.17.9",
    "peewee-migrate==1.12.2",
    "psycopg2-binary==2.9.9",
    "pgvector==0.4.0",
    "PyMySQL==1.1.1",
    "bcrypt==4.3.0",

    "pymongo",
    "redis",
    "boto3==1.35.53",

    "argon2-cffi==23.1.0",
    "APScheduler==3.10.4",


    "RestrictedPython==8.0",
    "sandlock>=0.8.6",

    "loguru==0.7.2",
    "asgiref==3.8.1",

    "openai",
    "anthropic",
    "google-generativeai==0.8.4",
    "tiktoken",

    "langchain==1.4.6",
    "langchain-community==0.4.2",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.3",

    "fake-useragent==2.1.0",
    "chromadb==0.6.3",
    "pymilvus==2.5.0",
    "qdrant-client~=1.12.0",
    "opensearch-py==2.8.0",
    "playwright==1.49.1",
    "elasticsearch==8.17.1",

    "transformers",
    # Listed directly so tool.uv.sources applies to it.
    "torch",
    "sentence-transformers==3.3.1",
    "accelerate",
    "colbert-ai==0.2.21",
    "einops==0.8.1",

    "ftfy==6.2.3",
    "pypdf==4.3.1",
    "fpdf2==2.8.2",
    "pymdown-extensions==10.14.2",
    "docx2txt==0.8",
    "python-pptx==1.0.0",
    "unstructured==0.27.27",
    # The spaCy model unstructured loads; installed here so it is not downloaded at runtime.
    "en-core-web-sm",
    # The encoding detector TextLoader imports when a text file is not UTF-8. Held at 6.x:
    # chardet 7 adds a mime_type key that langchain-community 0.4.2's FileEncoding(**enc) rejects.
    "chardet==6.0.0.post1",
    "nltk==3.9.1",
    "Markdown==3.7",
    "pypandoc==1.15",
    "pandas==2.2.3",
    "xarray>=2026.9.0",
    "zarr>=3.4.1",
    "matplotlib>=3.8.0",
    "openpyxl==3.1.5",
    "pyxlsb==1.0.10",
    "xlrd==2.0.1",
    "validators==0.34.0",
    "psutil",
    "sentencepiece",
    "soundfile==0.13.1",
    "azure-ai-documentintelligence==1.0.0",

    "pillow==11.1.0",
    "opencv-python-headless==4.11.0.86",
    "rapidocr-onnxruntime==1.4.4",
    # The OCR package langchain-community's PDF image extraction imports.
    "rapidocr==3.10.0",
    "rank-bm25==0.2.2",

    "onnxruntime==1.20.1",

    "faster-whisper==1.1.1",

    "PyJWT[crypto]==2.10.1",
    "authlib==1.4.1",

    "black==25.1.0",
    "langfuse==4.14.4",
    "youtube-transcript-api==1.0.3",
    "pytube==15.0.0",

    "extract_msg",
    "pydub",
    "duckduckgo-search~=8.0.0",

    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",

    "googleapis-common-protos==1.63.2",
    "google-cloud-storage==2.19.0",

    "azure-identity==1.21.0",
    "azure-storage-blob==12.24.1",

    "ldap3==2.9.1",

    "firecrawl-py==1.12.0",

    "tencentcloud-sdk-python==3.0.1336",

    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-requests==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-aiohttp-client==0.65b0",
]
readme = "README.md"
requires-python = ">= 3.12, < 3.13.0a1"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.scripts]
open-webui = "open_webui:app"

[dependency-groups]
dev = [
    "pytest~=8.3.2",
    "moto[s3]>=5.0.26",
    "gcp-storage-emulator>=2024.8.3",
]

[tool.uv]
# gcp-storage-emulator's fs imports pkg_resources, removed in setuptools 82.
constraint-dependencies = ["setuptools<82"]

# CPU torch keeps the CUDA packages (nvidia-*, triton) out of the lock.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".webui_secret_key",
    "dev.sh",
    "start.sh",
    "start_windows.bat",
    "webui.db",
    "chroma.sqlite3",
]
force-include = { "CHANGELOG.md" = "open_webui/CHANGELOG.md", build = "open_webui/frontend" }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'
